{% extends 'core/base.html' %}
{% load static %}

{% block content %}

{% if not request.user.is_staff %}

<section class="ruleta-wrapper">

    <h1 class="ruleta-title">Ruleta FlowLife</h1>
    <p class="ruleta-subtitle">Decide sin pensar. Solo gira.</p>

    <div class="ruleta-stage">

        <canvas id="ruletaCanvas" width="420" height="420"></canvas>

        <div class="ruleta-pointer"></div>

        <div class="ruleta-glow"></div>

    </div>

    <button id="spinBtn">Girar</button>

    <h2 id="resultado"></h2>

</section>

<script>
    window.actividades = JSON.parse('{{ actividades_json|escapejs }}');
</script>

<script src="{% static 'js/ruleta.js' %}"></script>

{% endif %}

{% endblock %}
